name: CI

# The "a stranger clones this and runs npm test" channel. Everything here is
# offline: the unit suite stubs the provider wire, the MCP tests and the smoke
# run against a fixture stdio server in test/fixtures. No model is called.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The locked Vitest and Vite releases share this minimum on Node 22.
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run smoke
