name: CI

# The "a stranger clones this and runs npm test" channel. Everything here is
# offline: the unit suite stubs the provider wire, the MCP tests and the smoke
# run against a fixture stdio server in test/fixtures. No model is called.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json says >=20; vite 7 needs ^20.19 || >=22.12, so 20 here
        # is the newest 20.x. tools/screenshot.mjs alone needs 22 (global
        # WebSocket) and is not run in CI.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run smoke
